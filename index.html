<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 21'%3E%3Crect width='30' height='21' rx='6' fill='%23ff0033'/%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--bg-card:#f2f2f2;--hover:#f4efe6;--text-main:#0f0f0f;--text-muted:#606060;--border:#e5e5e5;--primary:#ff0033;--chip-on-bg:#0f0f0f;--chip-on-fg:#fff;--nav-height:60px;--head:56px;--side:72px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--bg-card:#272727;--hover:#272727;--text-main:#f1f1f1;--text-muted:#aaa;--border:#303030;--chip-on-bg:#f1f1f1;--chip-on-fg:#0f0f0f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f0f;--bg-card:#272727;--hover:#272727;--text-main:#f1f1f1;--text-muted:#aaa;--border:#303030;--chip-on-bg:#f1f1f1;--chip-on-fg:#0f0f0f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text-main);padding-bottom:calc(var(--nav-height) + 16px);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:101}
.hidden{display:none!important}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:10px 20px;border-radius:20px;font-weight:600;cursor:pointer;transition:transform .2s}
.btn-primary:active{transform:scale(.95)}
.btn-primary:disabled{opacity:.6}
.full-width{width:100%}
.main-header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--head);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;z-index:100}
.hdr-left,.hdr-right{display:flex;align-items:center;gap:8px}
.icon-btn{background:none;border:none;color:var(--text-main);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn:hover{background:var(--bg-card)}
.icon-btn svg{width:22px;height:22px}
.logo{display:flex;align-items:center;gap:4px;font-size:1.15rem;font-weight:700;letter-spacing:-.6px;cursor:pointer;white-space:nowrap}
.logo svg{width:30px;height:21px}
.search-container{flex:1;max-width:640px;display:flex;align-items:center;gap:8px;position:relative}
.search-box{flex:1;display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--bg);min-width:0}
.search-box:focus-within{border-color:#1c62b9}
.search-box input{flex:1;min-width:0;height:38px;padding:0 16px;background:transparent;border:none;outline:none;color:var(--text-main);font-size:1rem}
.search-btn{width:56px;background:var(--bg-card);border:none;border-left:1px solid var(--border);color:var(--text-main);cursor:pointer;display:flex;align-items:center;justify-content:center}
.search-btn svg{width:20px;height:20px}
.suggestions-dropdown{position:absolute;top:110%;left:0;right:48px;background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;z-index:110;box-shadow:0 4px 24px rgba(0,0,0,.25)}
.suggestion-item{padding:10px 16px;cursor:pointer}
.suggestion-item:hover{background:var(--bg-card)}
.suggestion-item small{display:block;color:var(--text-muted);font-size:.8rem;margin-top:2px}
.btn-create{background:var(--bg-card);border:none;color:var(--text-main);border-radius:20px;padding:0 16px;height:36px;display:flex;align-items:center;gap:6px;font-weight:500;cursor:pointer}
.btn-create svg{width:20px;height:20px}
.hdr-avatar{border:none;background:none;padding:0 4px;cursor:pointer}
.hdr-avatar img{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;background:#333}
.hdr-hide-m{display:none}
.sidebar{display:none;position:fixed;top:calc(var(--head) + env(safe-area-inset-top,0px));left:0;bottom:0;width:var(--side);padding:4px;background:var(--bg);flex-direction:column;z-index:90}
.nav-item{background:none;border:none;color:var(--text-main);display:flex;flex-direction:column;align-items:center;font-size:.72rem;gap:4px;cursor:pointer;flex:1}
.nav-item svg{width:24px;height:24px}
.nav-item.active span{font-weight:700}
.side-item{flex:none;padding:16px 0 14px;font-size:.65rem;border-radius:10px}
.side-item:hover{background:var(--bg-card)}
.content-container{margin-top:var(--head);padding:0 12px}
.chips{display:flex;gap:12px;overflow-x:auto;padding:12px 0;position:sticky;top:calc(var(--head) + env(safe-area-inset-top,0px));background:var(--bg);z-index:50;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:none;background:var(--bg-card);color:var(--text-main);padding:0 12px;height:32px;border-radius:8px;font-size:.88rem;font-weight:500;cursor:pointer;flex-shrink:0}
.chip.active{background:var(--chip-on-bg);color:var(--chip-on-fg)}
#feedTitle{font-size:1.05rem;font-weight:500;margin:4px 0 8px}
#feedTitle:empty{display:none}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px 16px;margin-top:8px}
.video-card{cursor:pointer;border-radius:12px;transition:background .15s,box-shadow .15s}
@media(hover:hover){.video-card:hover{background:var(--hover);box-shadow:0 0 0 8px var(--hover)}}
.thumbnail-wrapper{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222}
.thumbnail-wrapper img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;font-weight:500;padding:2px 5px;border-radius:4px}
.card-row{display:flex;gap:12px;padding-top:12px}
.card-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#333}
.card-info{flex:1;min-width:0}
.card-title{font-size:1rem;font-weight:500;line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-channel,.card-metadata{font-size:.85rem;color:var(--text-muted);line-height:1.45}
.card-caption{font-size:.8rem;color:var(--text-muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{background:none;border:none;color:var(--text-main);cursor:pointer;width:32px;height:32px;border-radius:50%;flex-shrink:0;font-size:1.3rem;line-height:1}
.more-btn:hover{background:var(--border)}
.menu-pop{position:fixed;z-index:250;background:var(--bg-card);border-radius:12px;padding:8px 0;min-width:190px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text-main);padding:10px 16px;cursor:pointer;font-size:.9rem}
.menu-pop button:hover{background:var(--border)}
.card-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--text-muted);margin-top:8px}
.btn-del{background:none;border:1px solid var(--border);color:#e0294a;border-radius:14px;padding:3px 10px;font-size:.75rem;cursor:pointer;margin-top:8px}
.player-section{margin:12px auto 24px;max-width:1000px}
.player-wrapper{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player-wrapper video{width:100%;height:100%}
.video-details{padding:12px 0;border-bottom:1px solid var(--border)}
.video-details h1{font-size:1.25rem;font-weight:600}
.author-line{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--text-muted);font-size:.9rem}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#222;border:2px solid var(--border);display:block}
.avatar.sm{width:28px;height:28px;border:none}
.caption{margin-top:10px;font-size:.92rem;white-space:pre-wrap;background:var(--bg-card);border-radius:12px;padding:10px 12px}
.caption:empty{display:none}
.video-actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:8px}
.video-stats{color:var(--text-muted);font-size:.9rem}
.action-buttons{display:flex;gap:8px;flex-wrap:wrap}
.like-dislike-group{display:flex;background:var(--bg-card);border-radius:20px;overflow:hidden}
.action-btn{background:none;border:none;color:var(--text-main);padding:8px 16px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.9rem;font-weight:500}
.action-btn.download{background:var(--bg-card);border-radius:20px}
.action-btn:hover{filter:brightness(.95)}
.action-btn svg{width:18px;height:18px}
.action-btn.liked svg{color:var(--primary);fill:var(--primary);animation:pulse .3s}
.action-btn.disliked svg{color:var(--text-muted);fill:var(--text-muted)}
.action-btn.faved svg{color:#f5a800;fill:#f5a800}
@keyframes pulse{50%{transform:scale(1.4)}}
.ico{width:20px;height:20px;display:inline-block;flex-shrink:0;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}

.comments-section{padding:16px 0}
.comment-input-block{display:flex;gap:12px;margin:16px 0}
.comment-input-block input{flex:1;background:var(--bg);border:none;border-bottom:1px solid var(--border);padding:10px 4px;color:var(--text-main);outline:none}
.comment-item{padding:12px 0}
.comment-user{font-weight:600;font-size:.85rem;margin-bottom:4px}
.comment-text{font-size:.9rem}
.profile-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:16px 0 18px}
.avatar-wrap{position:relative;cursor:pointer;display:block}
.avatar-edit{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:.7rem;color:#fff;background:rgba(0,0,0,.65);border-radius:0 0 48px 48px;padding:4px 0}
.profile-info{flex:1;min-width:220px}
.name-row{display:flex;gap:8px;margin-bottom:8px}
.name-row input{flex:1;background:var(--bg);border:1px solid var(--border);padding:10px 14px;border-radius:20px;color:var(--text-main);outline:none}
.profile-stats,.mode-note{color:var(--text-muted);font-size:.85rem}
.mode-note{margin-top:4px;font-size:.75rem}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.tab{background:none;border:none;color:var(--text-muted);padding:10px 16px;cursor:pointer;font-weight:600;border-bottom:2px solid transparent}
.tab.active{color:var(--text-main);border-bottom-color:var(--text-main)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-height) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:100;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
.bottom-nav.nav-hidden{transform:translateY(100%)}
.shimmer-card{aspect-ratio:16/10;background:linear-gradient(90deg,var(--bg-card) 25%,var(--border) 50%,var(--bg-card) 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:12px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-content{background:var(--bg);border:1px solid var(--border);padding:24px;border-radius:16px;width:100%;max-width:450px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;margin-bottom:16px}
.close-btn{background:none;border:none;color:var(--text-main);font-size:1.5rem;cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-size:.85rem;color:var(--text-muted)}
.form-group input,.form-group textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);color:var(--text-main);border-radius:8px;outline:none}
.form-group textarea{resize:vertical;min-height:70px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:8px;z-index:300;font-size:.9rem}
.btn-follow,.btn-sec{border:none;border-radius:18px;padding:6px 14px;font-weight:600;cursor:pointer;background:var(--text-main);color:var(--bg);font-size:.85rem}
.btn-sec{background:var(--bg-card);color:var(--text-main);padding:10px 20px}
[data-user]{cursor:pointer}
#profName{font-size:1.4rem;font-weight:600;margin-bottom:8px}
.dm{display:grid;grid-template-columns:280px 1fr;gap:12px;height:calc(100vh - 170px);min-height:380px;margin-top:12px}
.dm-list{overflow-y:auto;border:1px solid var(--border);border-radius:12px}
.dm-item{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.dm-item:hover,.dm-item.active{background:var(--bg-card)}
.dm-item small{display:block;color:var(--text-muted);font-size:.75rem}
.dm-chat{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;min-width:0}
.dm-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.dm-back{display:none}
.dm-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:75%;align-self:flex-start;background:var(--bg-card);padding:8px 12px;border-radius:14px;font-size:.92rem;word-break:break-word}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff}
.bubble small{display:block;font-size:.65rem;opacity:.7;margin-top:2px}
.dm-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
.dm-form input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text-main);outline:none}
@media(max-width:767px){.dm{grid-template-columns:1fr;height:calc(100vh - 210px)}.dm .dm-chat{display:none}.dm.chat-open .dm-list{display:none}.dm.chat-open .dm-chat{display:flex}.dm-back{display:inline-flex}}
@media(min-width:768px){
  .hdr-hide-m{display:flex}
  .sidebar{display:flex}
  .bottom-nav{display:none}
  body{padding-bottom:24px}
  .content-container{margin-left:var(--side);padding:0 24px}
  body.side-hidden .sidebar{display:none}
  body.side-hidden .content-container{margin-left:0}
  .main-header{padding:0 16px}
}
.thumbnail-wrapper video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.share-grid a,.share-grid button{display:block;text-align:center;text-decoration:none;color:var(--text-main);background:var(--bg-card);border:none;border-radius:12px;padding:14px 6px;font-size:.85rem;font-weight:500;cursor:pointer}
.share-grid a:hover,.share-grid button:hover{filter:brightness(.93)}
</style>
</head>
<body>
<header class="main-header">
  <div class="hdr-left">
    <button class="icon-btn hdr-hide-m" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
    <div class="logo" id="logoBtn"><svg viewBox="0 0 30 21"><rect width="30" height="21" rx="6" fill="#ff0033"/><path d="M12 6l7 4.5-7 4.5z" fill="#fff"/></svg><span>VX zaraki</span></div>
  </div>
  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Pesquisar por legenda..." autocomplete="off">
      <button class="search-btn" id="searchBtn" aria-label="Pesquisar"><i data-lucide="search"></i></button>
    </div>
    <button class="icon-btn hdr-hide-m" id="micBtn" aria-label="Pesquisa por voz" style="background:var(--bg-card)"><i data-lucide="mic"></i></button>
    <div id="searchSuggestions" class="suggestions-dropdown hidden"></div>
  </div>
  <div class="hdr-right">
    <button class="btn-create hdr-hide-m" id="createBtn"><i data-lucide="plus"></i><span>Criar</span></button>
    <button class="icon-btn hdr-hide-m" id="bellBtn" aria-label="Notificações"><i data-lucide="bell"></i></button>
    <button class="hdr-avatar" id="hdrAvatar" aria-label="Minha conta"><img alt=""></button>
  </div>
</header>
<aside class="sidebar" id="sidebar"></aside>

<main class="content-container">
  <section id="videoPlayerSection" class="player-section hidden">
    <div class="player-wrapper"><video id="mainVideo" controls playsinline></video></div>
    <div class="video-details">
      <h1 id="playerTitle"></h1>
      <div class="author-line" id="authorLine"></div>
      <div class="video-actions">
        <div class="video-stats"><span id="playerViews"></span> • <span id="playerDate"></span></div>
        <div class="action-buttons">
          <div class="like-dislike-group">
            <button id="likeBtn" class="action-btn"><i class="ico ico-like"></i><span id="likeCount">0</span></button>
            <button id="dislikeBtn" class="action-btn"><i class="ico ico-dislike"></i></button>
          </div>
          <button id="shareBtn" class="action-btn download"><i data-lucide="share-2"></i><span>Compartilhar</span></button>
          <button id="favBtn" class="action-btn download"><i data-lucide="star"></i><span>Favoritar</span></button>
          <button id="downloadBtn" class="action-btn download"><i data-lucide="download"></i><span>Baixar</span></button>
        </div>
      </div>
      <p class="caption" id="playerCaption"></p>
    </div>
    <div class="comments-section">
      <h3>Comentários</h3>
      <form id="commentForm" class="comment-input-block">
        <input type="text" id="commentInput" placeholder="Adicione um comentário público..." required>
        <button type="submit" class="btn-primary">Comentar</button>
      </form>
      <div id="commentsList"></div>
    </div>
  </section>

  <section id="accountSection" class="hidden">
    <div class="profile-head">
      <label class="avatar-wrap"><img id="avatarImg" class="avatar" alt="Foto de perfil"><span class="avatar-edit">Trocar foto</span><input type="file" id="avatarInput" accept="image/*" hidden></label>
      <div class="profile-info">
        <div class="name-row" id="nameRow"><input id="nameInput" maxlength="30" placeholder="Seu nome"><button id="saveName" class="btn-primary">Salvar</button></div>
        <h2 id="profName" class="hidden"></h2>
        <div class="name-row" id="profActions"></div>
        <div class="profile-stats" id="profileStats"></div>
        <div class="mode-note" id="modeNote"></div>
      </div>
    </div>
    <div class="tabs"><button class="tab active" data-tab="mine">Meus vídeos</button><button class="tab" id="favTab" data-tab="favs">Favoritos</button></div>
    <div id="accountGrid" class="video-grid"></div>
  </section>

  <section id="msgSection" class="hidden">
    <div class="dm" id="dm">
      <div class="dm-list" id="dmList"></div>
      <div class="dm-chat">
        <div class="dm-head" id="dmHead"><button class="icon-btn dm-back" id="dmBack" aria-label="Voltar">←</button><b id="dmWith"></b></div>
        <div class="dm-msgs" id="dmMsgs"></div>
        <form class="dm-form" id="dmForm"><input id="dmInput" placeholder="Escreva uma mensagem..." autocomplete="off"><button class="btn-primary">Enviar</button></form>
      </div>
    </div>
    <p class="mode-note" id="dmNote"></p>
  </section>

  <section class="feed-section">
    <div class="chips" id="chips"></div>
    <h2 id="feedTitle">Vídeos Recomendados</h2>
    <div id="videoGrid" class="video-grid">
      <div class="shimmer-card"></div><div class="shimmer-card"></div><div class="shimmer-card"></div><div class="shimmer-card"></div>
    </div>
  </section>
</main>

<div id="uploadModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header"><h2>Enviar Vídeo</h2><button id="closeUploadBtn" class="close-btn">&times;</button></div>
    <form id="uploadForm">
      <div class="form-group"><label for="videoTitle">Título do Vídeo</label><input type="text" id="videoTitle" required placeholder="Ex: Melhores momentos Zaraki"></div>
      <div class="form-group"><label for="videoCaption">Legenda (descrição e #hashtags — usada na pesquisa)</label><textarea id="videoCaption" maxlength="500" placeholder="Ex: Luta épica do Zaraki contra Ichigo #bleach #amv"></textarea></div>
      <div class="form-group" id="fileGroup"><label for="videoFile">Arquivo de vídeo (até 50 MB)</label><input type="file" id="videoFile" accept="video/*"></div>
      <div class="form-group"><label for="videoUrl">ou URL do Vídeo (MP4)</label><input type="url" id="videoUrl" placeholder="https://exemplo.com/video.mp4"></div>
      <div class="form-group"><label for="thumbUrl">URL da Thumbnail (opcional)</label><input type="url" id="thumbUrl" placeholder="https://exemplo.com/thumb.jpg"></div>
      <button type="submit" class="btn-primary full-width">Postar Vídeo</button>
    </form>
  </div>
</div>

<div id="shareModal" class="modal hidden"><div class="modal-content">
  <div class="modal-header"><h2>Compartilhar</h2><button id="closeShare" class="close-btn">&times;</button></div>

  <div class="form-group"><input id="shareLink" readonly></div>

<div id="loginModal" class="modal hidden"><div class="modal-content">

  <button type="submit" class="btn-primary full-width">Enviar link</button></form>
</div></div>

<script>
const BASE = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/";
function thumbSvg(t, c){
  return "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient></defs><rect width="320" height="180" fill="url(#g)"/><text x="160" y="100" font-family="sans-serif" font-size="48" font-weight="800" fill="#fff" text-anchor="middle">${t}</text></svg>`);
}
const DEFAULT_VIDEOS = [
  {id:"1",title:"Zaraki Kenpachi AMV - O Despertar do Demônio [4K]",url:BASE+"BigBuckBunny.mp4",thumb:thumbSvg("VX","#ff0033"),views:142000,baseLikes:12500,date:"há 2 dias"},
  {id:"2",title:"VX zaraki Nova Atualização De Combate Fluid CSS",url:BASE+"ElephantsDream.mp4",thumb:thumbSvg("CSS","#7a1fff"),views:89000,baseLikes:7200,date:"há 5 dias"},
  {id:"3",title:"Como criar layouts Fluidos e Rápidos para Dispositivos Móveis",url:BASE+"Sintel.mp4",thumb:thumbSvg("UI","#0077ff"),views:5300,baseLikes:410,date:"há 10 horas"}
];
DEFAULT_VIDEOS[0].caption = "Zaraki Kenpachi em ação: luta, espada e muita adrenalina. #bleach #anime #amv";
DEFAULT_VIDEOS[1].caption = "Novidades do VX zaraki: combate fluido, animações suaves e CSS moderno. #css #dev";
DEFAULT_VIDEOS[2].caption = "Tutorial de layouts rápidos e responsivos para celular. #mobile #design #tutorial";
DEFAULT_VIDEOS[0].duration = 596; DEFAULT_VIDEOS[1].duration = 654; DEFAULT_VIDEOS[2].duration = 888;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(k, f){ try{ return JSON.parse(localStorage.getItem(k)) || f; }catch(e){ return f; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
const icons = () => { if (window.lucide) lucide.createIcons(); };
const fmt = n => n >= 1000 ? (n/1000).toFixed(1) + 'K' : n;
function rel(ts){
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return "agora mesmo"; if (m < 60) return `há ${m} min`;
  const h = Math.floor(m/60); if (h < 24) return `há ${h} h`;
  return `há ${Math.floor(h/24)} dias`;
}

// ===== CAMADA DE DADOS: compartilhada (db) ou local (localStorage) =====
let mode = 'local', uid = 'local', DB = null, ASSETS = null;
let S = { videos: load('vx_videos', DEFAULT_VIDEOS), reactions: load('vx_reactions2', []), comments: load('vx_comments2', []), favs: load('vx_favs', []), profiles: load('vx_profiles', {}) };
let currentVideoId = null, viewUid = null, chatPeer = null;
S.follows = {}; S.dmIn = []; S.dmOut = [];
const saveLocal = () => { store('vx_videos', S.videos); store('vx_reactions2', S.reactions); store('vx_comments2', S.comments); store('vx_favs', S.favs); store('vx_profiles', S.profiles); };

const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const isFav = id => S.favs.some(f => f.videoId===id && f.uid===uid);
function searchVideos(q){
  const terms = norm(q).split(/\s+/).filter(Boolean);
  const all = S.videos.map(v => ({v, c:norm(v.caption), t:norm(v.title)}));
  if (!terms.length) return all.map(x => x.v).sort((a,b) => (b.ts||0)-(a.ts||0));
  return all.map(x => { let sc = 0;
      for (const w of terms){ const c = x.c.includes(w), t = x.t.includes(w); if (!c && !t) return null; sc += (c?3:0) + (t?1:0); }
      return {v:x.v, sc}; })
    .filter(Boolean).sort((a,b) => b.sc-a.sc || (b.v.ts||0)-(a.v.ts||0)).map(x => x.v);
}

function resizeImg(file, size=160){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = size; const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .8)); };
    img.onerror = () => rej(new Error('imagem inválida')); img.src = u;
  });
}

// ---- Criptografia ponta a ponta (ECDH P-256 + AES-GCM) ----
const ECA = {name:'ECDH', namedCurve:'P-256'};
let myPriv = null, keysReady = false; const aesCache = {}, plainCache = new Map();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function initKeys(){
  try{
    if (!(window.crypto && crypto.subtle)) return;
    const ref = DB.collection('data/users/' + uid).doc('e2e'), pref = DB.collection('profiles').doc(uid);
    const [d, pd] = await Promise.all([ref.get(), pref.get()]);
    const prof = pd.exists ? pd.data() : {};
    let priv = d.exists ? d.data().priv : null;
    if (!priv){
      const kp = await crypto.subtle.generateKey(ECA, true, ['deriveKey']);
      priv = await crypto.subtle.exportKey('jwk', kp.privateKey);
      await ref.set({priv}); delete prof.pub;
    }
    if (!prof.pub) await pref.set({...prof, pub: {kty: priv.kty, crv: priv.crv, x: priv.x, y: priv.y, ext: true}});
    myPriv = await crypto.subtle.importKey('jwk', priv, ECA, false, ['deriveKey']); keysReady = true;
  }catch(e){ keysReady = false; }
}
async function aesFor(peer){
  const pj = (S.profiles[peer] || {}).pub; if (!pj || !myPriv) return null;
  const sig = JSON.stringify(pj); if (aesCache[peer] && aesCache[peer].sig === sig) return aesCache[peer].k;
  const pk = await crypto.subtle.importKey('jwk', pj, ECA, false, []);
  const k = await crypto.subtle.deriveKey({name:'ECDH', public: pk}, myPriv, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  aesCache[peer] = {sig, k}; return k;
}
async function sendDm(peer, text){
  const k = await aesFor(peer).catch(() => null);
  if (!k) return toast('Não foi possível cifrar: esse usuário ainda não ativou mensagens.');
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(text));
  DB.collection('dm').add({from: uid, to: peer, iv: b64(iv), ct: b64(ct), ts: Date.now()}).catch(errToast);
}
async function readDm(m){
  if (plainCache.has(m.id)) return plainCache.get(m.id);
  const peer = m.from === uid ? m.to : m.from;
  try{ const k = await aesFor(peer);
    if (k){ const t = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(m.iv)}, k, unb64(m.ct))); plainCache.set(m.id, t); return t; } }catch(_){}
  return '🔒 Não foi possível decifrar';
}
async function renderDm(){
  const dl = $('dmList');
  if (!social()){ dl.innerHTML = ''; $('dmMsgs').innerHTML = ''; $('dmHead').classList.add('hidden'); $('dmForm').classList.add('hidden'); $('dmNote').textContent = 'Mensagens e amizades exigem a conta compartilhada (abra o link logado no claude.ai).'; return; }
  $('dmNote').textContent = keysReady ? '🔒 Cifradas de ponta a ponta: só você e o destinatário leem o conteúdo. Quem administra o banco vê apenas quem conversa com quem e quando.' : 'Ativando criptografia…';
  const all = allDm(), last = {};
  all.forEach(m => { const p = m.from === uid ? m.to : m.from; last[p] = Math.max(last[p]||0, m.ts||0); });
  const ids = [...new Set([...myFollows(), ...Object.keys(last)])].sort((a,b) => (last[b]||0) - (last[a]||0));
  dl.innerHTML = ids.length ? ids.map(id => `<div class="dm-item ${id===chatPeer ? 'active' : ''}" data-id="${esc(id)}"><img class="card-avatar" src="${esc(avatarOf(id))}" alt=""><div><b>${esc(nameOf(id))}</b><small>${isFriend(id) ? 'Amigo' : isFollowing(id) ? 'Seguindo' : 'Conversa'}</small></div></div>`).join('')
    : '<p class="mode-note" style="padding:12px">Siga alguém para conversar: toque no nome de um canal para abrir o perfil.</p>';
  dl.querySelectorAll('.dm-item').forEach(el => el.onclick = () => openChat(el.dataset.id));
  $('dm').classList.toggle('chat-open', !!chatPeer);
  $('dmHead').classList.toggle('hidden', !chatPeer); $('dmForm').classList.toggle('hidden', !chatPeer);
  if (!chatPeer){ $('dmMsgs').innerHTML = ''; return; }
  $('dmWith').textContent = nameOf(chatPeer);
  const msgs = all.filter(m => (m.from === uid && m.to === chatPeer) || (m.from === chatPeer && m.to === uid));
  const texts = await Promise.all(msgs.map(readDm));
  const box = $('dmMsgs');
  box.innerHTML = msgs.length ? msgs.map((m,i) => `<div class="bubble ${m.from===uid ? 'me' : ''}">${esc(texts[i])}<small>${new Date(m.ts||Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</small></div>`).join('') : '<p class="mode-note">Nenhuma mensagem ainda. Diga olá!</p>';
  box.scrollTop = box.scrollHeight;
}

}
function setReaction(videoId, type){

function fmtDur(s){ s = Math.round(s||0); if (!s) return ''; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); }

function makeCard(v, stats){
  const card = document.createElement('div'); card.className = 'video-card';
  const nc = S.comments.filter(c => c.videoId===v.id).length, nf = S.favs.filter(f => f.videoId===v.id).length, a = v.author || 'vx';
  card.innerHTML = `<div class="thumbnail-wrapper">${noThumb(v) ? `<video src="${esc(v.url)}#t=0.8" preload="metadata" muted playsinline></video>` : `<img src="${esc(v.thumb)}" alt="${esc(v.title)}" loading="lazy">`}${v.duration ? `<span class="dur">${fmtDur(v.duration)}</span>` : ''}</div>
    <div class="card-row"><img class="card-avatar" src="${esc(avatarOf(a))}" alt="">
    <div class="card-info"><h3 class="card-title">${esc(v.title)}</h3>
    <div class="card-channel">${esc(nameOf(a))}</div>
    <div class="card-metadata">${fmt(v.views||0)} visualizações • ${esc(v.date || rel(v.ts||Date.now()))}</div>
    ${v.caption ? `<div class="card-caption">${esc(snip(v))}</div>` : ''}
    ${stats ? `<div class="card-stats"><span>▶ ${fmt(v.views||0)}</span><span>👍 ${fmt(likesOf(v))}</span><span>💬 ${nc}</span><span>★ ${nf}</span></div><button class="btn-del">Excluir</button>` : ''}</div>
    <button class="more-btn" aria-label="Mais opções">⋮</button></div>`;
  card.addEventListener('click', () => playVideo(v.id));
  card.querySelector('.more-btn').addEventListener('click', e => { e.stopPropagation(); showMenu(e.currentTarget, v); });
  if (v.author) card.querySelectorAll('.card-avatar,.card-channel').forEach(el => { el.style.cursor = 'pointer'; el.addEventListener('click', e => { e.stopPropagation(); openProfile(v.author); }); });
  const del = card.querySelector('.btn-del');
  if (del) del.addEventListener('click', e => {
    e.stopPropagation();
    if (del.dataset.ok){ deleteVideo(v.id); } else { del.dataset.ok = 1; del.textContent = 'Confirmar exclusão?'; setTimeout(() => { del.dataset.ok = ''; del.textContent = 'Excluir'; }, 3000); }
  });
  return card;
}
function renderChips(q){
  const cnt = {};
  S.videos.forEach(v => (String(v.caption||'').match(/#[\p{L}\p{N}_]+/gu) || []).forEach(t => { t = t.toLowerCase(); cnt[t] = (cnt[t]||0) + 1; }));
  const tags = Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,14).map(x => x[0]);
  const cur = String(q||'').trim().toLowerCase();
  $('chips').innerHTML = `<button class="chip ${!cur ? 'active' : ''}" data-t="">Todos</button>` + tags.map(t => `<button class="chip ${cur===t ? 'active' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { $('searchInput').value = c.dataset.t; sug.classList.add('hidden'); renderFeed(c.dataset.t); }));
}
function renderFeed(q = ""){
  const grid = $('videoGrid'); grid.innerHTML = "";
  const list = searchVideos(q);
  $('feedTitle').textContent = q.trim() ? `Resultados para "${q.trim()}"` : ""; renderChips(q);
  if (!list.length){
    grid.innerHTML = `<p style="color:var(--text-muted);padding:20px">${q.trim() ? "Nenhum vídeo com essa legenda." : "Nenhum vídeo ainda. Toque em Partilhar para enviar o primeiro!"}</p>`;
    return;
  }
  list.forEach(v => grid.appendChild(makeCard(v, false)));
}

function frameThumb(file){
  return new Promise(res => {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
    const url = URL.createObjectURL(file); v.src = url;
    let fin = false; const done = b => { if (fin) return; fin = true; URL.revokeObjectURL(url); res(b); };
    const tries = [0.1, 0.3, 0.5, 0.02]; let k = 0;
    const seek = () => { const d = v.duration || 1; v.currentTime = Math.min(Math.max(d * tries[k], 0.3), Math.max(d - 0.1, 0)); };
    const grab = () => {
      const w = 480, h = Math.round(w * (v.videoHeight||9) / (v.videoWidth||16));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.drawImage(v, 0, 0, w, h);
      const d = x.getImageData(0, 0, w, h).data; let s = 0, n = 0;
      for (let i = 0; i < d.length; i += 388){ s += d[i] + d[i+1] + d[i+2]; n += 3; }
      return {c, dark: s / n < 12};
    };
    v.onloadedmetadata = () => { frameThumb.dur = v.duration; seek(); };
    v.onseeked = () => {
      let p = false;
      const paint = () => {
        if (p) return; p = true;
        try{ const g = grab(); if (!g.dark || k >= tries.length - 1){ g.c.toBlob(done, 'image/jpeg', .8); return; } }catch(_){ return done(null); }
        k++; seek();
      };
      if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(paint);
      setTimeout(paint, 700);
    };
    v.onerror = () => done(null); setTimeout(() => done(null), 15000);
  });
}

// Adaptador: mantém a mesma API de coleções usada pelo resto do código
function mkDB(sb){
  const T = n => n.startsWith('data/users/') ? 'e2e_keys' : n;
  const P = n => n.startsWith('data/users/') ? n.split('/')[2] + ':' : '';
  const snap = r => ({id: r.id, data: () => r.data});
  function col(name, f){
    const t = T(name), pre = P(name);
    const sel = () => { let b = sb.from(t).select('id,data').order('created_at', {ascending:false}).limit(1000); if (f) b = b.eq('data->>' + f[0], f[2]); return b; };
    return {
      where: (a, o, b) => col(name, [a, o, b]),
      add: async d => { const {error} = await sb.from(t).insert({id: crypto.randomUUID(), data: d}); if (error) throw error; },
      doc: id => { const k = pre + id; return {
        get: async () => { const {data} = await sb.from(t).select('id,data').eq('id', k).maybeSingle(); return {exists: !!data, data: () => data && data.data}; },
        set: async d => { const {error} = await sb.from(t).upsert({id: k, data: d}); if (error) throw error; },
        update: async p => {
          if (t === 'videos' && 'views' in p){ await sb.rpc('bump_views', {vid: k}); return; }
          const {data} = await sb.from(t).select('data').eq('id', k).maybeSingle();
          const {error} = await sb.from(t).upsert({id: k, data: {...(data && data.data), ...p}}); if (error) throw error;
        },
        delete: async () => { const {error} = await sb.from(t).delete().eq('id', k); if (error) throw error; }
      }; },
      onSnapshot: cb => {
        let tm; const run = async () => { const {data, error} = await sel(); if (!error) cb({docs: (data || []).map(snap)}); }; run();
        sb.channel('ch-' + t + '-' + Math.random().toString(36).slice(2)).on('postgres_changes', {event:'*', schema:'public', table:t}, () => { clearTimeout(tm); tm = setTimeout(run, 300); }).subscribe();
      }
    };
  }
  return {collection: n => col(n)};
}
